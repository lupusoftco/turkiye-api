services:
  api:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_URL: http://localhost:8080
      APP_KEY: change-me
    volumes:
      - storage:/var/www/app/storage
    restart: unless-stopped

  # Fetches the TCMB bulletin every 30 minutes on weekday afternoons.
  rates:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          su -s /bin/sh www-data -c "php bin/fetch-rates.php" || true
          sleep 1800
        done
    volumes:
      - storage:/var/www/app/storage
    depends_on: [api]
    restart: unless-stopped

volumes:
  storage:
