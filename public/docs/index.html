<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Türkiye API — Dokümantasyon</title>
  <meta name="description" content="TCMB döviz kurları, resmi tatiller ve iş günü hesabı, il/ilçe/mahalle ve posta kodları, TCKN/VKN/IBAN doğrulama, Türkçe metin araçları, QR kod ve link önizleme için açık kaynak REST API.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E30A17'/%3E%3Ccircle cx='13' cy='16' r='7' fill='%23fff'/%3E%3Ccircle cx='15' cy='16' r='5.6' fill='%23E30A17'/%3E%3Cpath d='M22 12.6l.9 2.6h2.7l-2.2 1.6.8 2.6-2.2-1.6-2.2 1.6.8-2.6-2.2-1.6h2.7z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    body { margin: 0; }
    .lang-switch {
      position: fixed; bottom: 16px; right: 16px; z-index: 10000;
      display: flex; padding: 3px; gap: 2px;
      background: #fff; border: 1px solid #d0d5dd; border-radius: 999px;
      box-shadow: 0 2px 8px rgba(16, 24, 40, .12);
      font: 600 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .lang-switch button {
      border: 0; background: transparent; color: #475467; cursor: pointer;
      padding: 7px 12px; border-radius: 999px; letter-spacing: .04em; font: inherit;
    }
    .lang-switch button[aria-pressed="true"] { background: #E30A17; color: #fff; }
    .lang-switch button:focus-visible { outline: 2px solid #E30A17; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      .lang-switch { background: #1f2329; border-color: #3a3f47; }
      .lang-switch button { color: #c9ccd1; }
    }
  </style>
</head>
<body>
  <div class="lang-switch" role="group" aria-label="Dil / Language">
    <button type="button" data-lang="tr" aria-pressed="false" title="Türkçe">TR</button>
    <button type="button" data-lang="en" aria-pressed="false" title="English">EN</button>
  </div>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1"></script>
  <script>
    (function () {
      var KEY = 'turkiye-api-docs-lang';
      var DOCS_VERSION = '2';
      var params = new URLSearchParams(location.search);
      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (e) {}

      // Priority: ?lang= in the URL, then the last choice, then the browser language.
      var lang = params.get('lang') || stored || ((navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en');
      if (lang !== 'tr' && lang !== 'en') lang = 'tr';

      document.documentElement.lang = lang;
      document.title = lang === 'tr' ? 'Türkiye API — Dokümantasyon' : 'Türkiye API — Documentation';
      document.querySelectorAll('.lang-switch button').forEach(function (btn) {
        btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang));
        btn.addEventListener('click', function () {
          if (btn.dataset.lang === lang) return;
          try { localStorage.setItem(KEY, btn.dataset.lang); } catch (e) {}
          params.set('lang', btn.dataset.lang);
          location.search = params.toString();
        });
      });

      Scalar.createApiReference('#app', {
        // ?v= busts browser caches whenever the documents change.
        url: (lang === 'tr' ? '../openapi.tr.yaml' : '../openapi.yaml') + '?v=' + DOCS_VERSION,
        theme: 'default',
        defaultHttpClient: { targetKey: 'js', clientKey: 'fetch' },
        metaData: { title: document.title },
      });
    })();
  </script>
</body>
</html>
